<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="description" content="" />
    <meta name="author" content="" />

    <title>Text To Speech</title>

    <!-- Custom fonts for this template-->
    <link
      href="static/vendor/fontawesome-free/css/all.min.css"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link href="static/css/sb-admin-2.min.css" rel="stylesheet" />
    <link href="static/css/style.css" rel="stylesheet" />
  </head>

  <body id="page-top">
    <!-- Page Wrapper -->
    <div id="wrapper">
      <!-- Sidebar -->
      {% include 'sidebar.html' %}
      <!-- End of Sidebar -->

      <!-- Content Wrapper -->
      <div
        id="content-wrapper"
        class="d-flex flex-column container-chat flag-texture"
      >
        <!-- Main Content -->
        <div id="content">
          <!-- Topbar -->
          <nav class="navbar navbar-expand navbar-light topbar mb-4 static-top">
            <!-- Sidebar Toggle (Topbar) -->
            <button
              id="sidebarToggleTop"
              class="btn btn-link d-md-none rounded-circle mr-3"
            >
              <i class="fa fa-bars"></i>
            </button>

            <!-- Topbar Navbar -->
            <div class="navbar-nav ml-auto">
              <div class="card shadow h-100 py-2 card-body">
                2025-03-06 14:59:45.946
              </div>
            </div>
          </nav>
          <!-- End of Topbar -->

          <!-- Begin Page Content -->
          <div class="chat-section">
            <div style="height:600px; overflow-y:scroll; padding-right:100px; padding-left:100px; overflow-x:hidden;" class="chat-scroll">

              <div class="row">
                {% for item in tts_data %}
                <div class="col-md-12 text-right" style="margin-bottom: 10px">
                  <strong>You:</strong> <strong>{{ item.q }}</strong>
                </div>

                <div class="col-md-12 text-left" style="margin-bottom: 20px">
                  <strong>Response:</strong>
                  <audio controls class="w-50" style="display: block">
                    <source src="{{ item.a }}" type="audio/wav" />
                    Your browser does not support the audio element.
                  </audio>
                </div>

                <div class="col-md-12 text-left">
                  <hr />
                </div>
                {% endfor %}
              </div>
            </div>

            <form
              name="form1"
              id="form1"
              method="post"
              action="{{ url_for('text_to_speech_route.text_to_speech') }}"
     >
              <div class="row">
                <div class="col-2">
                  <select name="lang" class="form-control">
                    <option value="">Select Language</option>
                    <option value="fr">French</option>
                    <option value="en">English</option>
                    <option value="zh-cn">Chinese</option>
                    <option value="de">German</option>
                    <option value="hi">Hindi</option>
                    <option value="es">Spanish</option>
                    <option value="it">Italian</option>
                    <option value="pt">Portuguese</option>
                    <option value="tr">Turkish</option>
                  </select>
                </div>

                <div class="col-2">
                  <select name="speaker" class="form-control">
                    <option value="">Select Speaker</option>
                    <option value="Ananth">Speaker 1</option>
                    <option value="Shashi">Speaker 2</option>
                  </select>
                </div>
              </div>




              <div class="mil-col-rght mt-3">
                <input
                  type="text"
                  name="query"
                  id="query"
                  class="form-control"
                  placeholder="Type a Message..."
                />
                <button type="submit" class="send-icon">
                  <img src="static/img/send-ico.png" alt="Send" />
                </button>
              </div>
            </form>

            <form
              action="{{ url_for('text_to_speech_route.clear_text_to_speech') }}"
              method="POST"
            >
              <button type="submit" class="btn btn-danger mt-3">
                Clear Chat
              </button>
            </form>
          </div>
          <!-- End of Page Content -->
        </div>
        <!-- End of Main Content -->
      </div>
      <!-- End of Content Wrapper -->
    </div>
    <!-- End of Page Wrapper -->

    <!-- Scroll to Top Button-->
    <a class="scroll-to-top rounded" href="#page-top">
      <i class="fas fa-angle-up"></i>
    </a>

    <script>
      // On page load, set the selected values if saved
      document.addEventListener("DOMContentLoaded", function () {
        const langSelect = document.querySelector("select[name='lang']");
        const speakerSelect = document.querySelector("select[name='speaker']");

        if (sessionStorage.getItem("selectedLang")) {
          langSelect.value = sessionStorage.getItem("selectedLang");
        }

        if (sessionStorage.getItem("selectedSpeaker")) {
          speakerSelect.value = sessionStorage.getItem("selectedSpeaker");
        }

        // Save on change
        langSelect.addEventListener("change", function () {
          sessionStorage.setItem("selectedLang", this.value);
        });

        speakerSelect.addEventListener("change", function () {
          sessionStorage.setItem("selectedSpeaker", this.value);
        });
      });
    </script>

    <!-- Bootstrap core JavaScript-->
    <script src="static/vendor/jquery/jquery.min.js"></script>
    <script src="static/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <!-- Core plugin JavaScript-->
    <script src="static/vendor/jquery-easing/jquery.easing.min.js"></script>
    <!-- Custom scripts for all pages-->
    <script src="static/js/sb-admin-2.min.js"></script>
  </body>
</html>
