<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>Code Chat</title>

    <!-- Custom fonts for this template-->
    <link href="static/vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link
        href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
        rel="stylesheet">
    <link href="static/css/sb-admin-2.min.css" rel="stylesheet">
	<link href="static/css/style.css" rel="stylesheet">

</head>

<body id="page-top">

    <!-- Page Wrapper -->
    <div id="wrapper">

        <!-- Sidebar -->
        {% include 'sidebar.html' %}


        <!-- End of Sidebar -->

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column container-chat flag-texture">

            <!-- Main Content -->
            <div id="content">

              <!-- Topbar -->
                <nav class="navbar navbar-expand navbar-light topbar mb-4 static-top">
                    <!-- Sidebar Toggle (Topbar) -->
                    <button id="sidebarToggleTop" class="btn btn-link d-md-none rounded-circle mr-3">
                        <i class="fa fa-bars"></i>
                    </button>

                    <!-- Topbar Navbar -->
                    <div class="navbar-nav ml-auto">
						<div class="card shadow h-100 py-2 card-body">2025-03-06 14:59:45.946</div>
                   </div>

                </nav>
                <!-- End of Topbar -->

                <!-- Begin Page Content -->
						<div class="chat-section">
              
                            <div style="height:600px; overflow-y:scroll; padding-right:100px; padding-left:100px; overflow-x:hidden;" class="chat-scroll">

                                <div class="row">
                                    {% for chat in chat_history %}
                                        <div class="col-md-12 text-right" style="margin-bottom:10px;">
                                            <strong>You:</strong> {{ chat.query }}
                                        </div>



                                        <div class="col-md-12 text-left mb-3">
                                          <strong>{{ chat.model }}:</strong> <div class="bot-response" id="response-{{ loop.index }}">



                                              {{ chat.response }}
                                          </div>
                                          <div class="mt-2">
                                              <button class="btn btn-sm btn-outline-successs" onclick="copyToClipboard('response-{{ loop.index }}')">Copy</button>
                                              <button class="btn btn-sm btn-outline-successs" onclick="exportToFile('response-{{ loop.index }}')">Export</button>
                                          </div>
                                      </div>
                                      

                                        
                                        <div class="col-md-12 text-left"><hr></div>
                                    {% endfor %}
                                </div>
                            </div>
                            
                            <form id="chat-form" class="miltry-form" onsubmit="sendMessage(event)">
                                <div class="mil-col-lft">
                                    <select class="form-control" name="model_name" id="model_name">



                                      <option value="llama3:13b">llama3:13b</option>
                                      <option value="llama2:7b">llama2:7b</option>
                                      <option value="gpt-3.5-turbo">gpt-3.5-turbo</option>
                                      <option value="gpt-4">gpt-4</option>




                                    </select>
                                </div>
                                <div class="mil-col-rght">
                                    <input type="text" name="query" id="query" class="form-control" placeholder="Type a Message... ">
                                    <button type="submit" class="send-icon">
                                        <img src="static/img/send-ico.png" alt="Send">
                                    </button>
                                </div>
                            </form>


                            <form action="{{ url_for('code_chat_route.code_chat_clear') }}" method="POST">
                                <button type="submit" class="btn btn-danger mt-3">Clear Chat</button>
                            </form>
                            





					</div>
            <!-- End of Main Content -->

 

        </div>
        <!-- End of Content Wrapper -->

    </div>
    <!-- End of Page Wrapper -->

    <!-- Scroll to Top Button-->
    <a class="scroll-to-top rounded" href="#page-top">
        <i class="fas fa-angle-up"></i>
    </a>
    <!-- Bootstrap core JavaScript-->
    <script src="static/vendor/jquery/jquery.min.js"></script>
    <script src="static/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <!-- Core plugin JavaScript-->
    <script src="static/vendor/jquery-easing/jquery.easing.min.js"></script>
    <!-- Custom scripts for all pages-->
    <script src="static/js/sb-admin-2.min.js"></script>


    <script>

      function copyToClipboard(elementId) {
        const text = document.getElementById(elementId).innerText;
        navigator.clipboard.writeText(text).then(() => {
          alert("Copied to clipboard!");
        }).catch((err) => {
          console.error("Failed to copy: ", err);
        });
      }
      
      function exportToFile(elementId) {
        const text = document.getElementById(elementId).innerText;
        const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
      
        const link = document.createElement("a");
        link.href = url;
        link.download = `chat_response_${elementId}.txt`;
        link.click();
      
        URL.revokeObjectURL(url);
      }
      
      
        function scrollChatToBottom() {
          const scrollContainer = document.querySelector(".chat-scroll");
          scrollContainer.scrollTop = scrollContainer.scrollHeight;
        }



        function sendMessage(event) {
          event.preventDefault();
        
          const query = document.getElementById("query").value;
          const model = document.getElementById("model_name").value;
          if (!query.trim()) return;
        
          const chatContainer = document.querySelector(".chat-section .row");
          const uniqueId = `response-${Date.now()}`;
        
          // Add user message
          const userMessageHTML = `
            <div class="col-md-12 text-right mb-2">
              <strong>You:</strong> ${query}
            </div>`;
        
          // Add bot message with placeholder + hidden buttons
          const botMessageHTML = `
            <div class="col-md-12 text-left mb-3">
              <strong>${model}:</strong>
              <div class="bot-response" id="${uniqueId}">
                <em>Typing...</em>
              </div>
              <div class="mt-2" id="buttons-${uniqueId}" style="display:none;">
                <button class="btn btn-sm btn-outline-successs" onclick="copyToClipboard('${uniqueId}')">Copy</button>
                <button class="btn btn-sm btn-outline-successs" onclick="exportToFile('${uniqueId}')">Export</button>
              </div>
            </div>
            <div class="col-md-12 text-left"><hr /></div>`;
        
          chatContainer.insertAdjacentHTML("beforeend", userMessageHTML + botMessageHTML);
          scrollChatToBottom();
        
          document.getElementById("query").value = "";
        
          fetch("/send_message_code", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ model_name: model, query: query }),
          })
            .then((res) => res.json())
            .then((data) => {
              const fullResponse = data.response || "No response";
              const words = fullResponse.split(" ");
              const outputSpan = document.getElementById(uniqueId);
              outputSpan.innerHTML = ""; // Clear Typing...
        
              let index = 0;
              const streamInterval = setInterval(() => {
                if (index < words.length) {
                  outputSpan.innerHTML += words[index] + " ";
                  index++;
                  scrollChatToBottom();
                } else {
                  clearInterval(streamInterval);
                  // Show Copy/Export buttons
                  document.getElementById(`buttons-${uniqueId}`).style.display = "block";
                }
              }, 40); // Typing speed
            })
            .catch((err) => {
              const outputSpan = document.getElementById(uniqueId);
              outputSpan.innerHTML = `<span style="color:red;"><strong>Error getting response.</strong></span>`;
              console.error(err);
            });
        }
        
      
      
      </script>
      
    
</body>

</html>
