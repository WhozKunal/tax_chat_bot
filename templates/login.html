<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">
    <title>login</title>
    
    <!-- Custom fonts for this template -->
    <link href="{{ url_for('static', filename='vendor/fontawesome-free/css/all.min.css') }}" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/sb-admin-2.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>

<body class="side-patt">
    <div class="login-container">
        <div class="login-right"></div>
        <div class="login-left">
            <p style = "text-align: center;"><img width="100px" src="{{ url_for('static', filename='img/logo-circle.png') }}"></p>
            <div class="log-section">
                <h1 class="log-head">Welcome to AI As Services</h1>
                <p class="black-login">Please Log in to your account</p>

                    <form action="{{ url_for('login') }}" method="POST" style="text-align: center;">
                        <input type="text" name="username" class="form-control my-3" placeholder="Username or Email..." required>
                        <input type="password" name="password" class="form-control" placeholder="Password..." required>
                        <button type="submit" class="log-btn my-3">Login</button> 
                    </form>
                
                  



                {% if error %}
                    <div class="alert alert-danger" role="alert">
                        {{ error }}
                    </div>
                {% endif %}
                {% with messages = get_flashed_messages() %}
                    {% if messages %}
                        <div class="alert alert-info" role="alert">
                            {{ messages[0] }}
                        </div>
                    {% endif %}
                {% endwith %}


                
            </div>
        </div>
    </div>
</body>
</html>
