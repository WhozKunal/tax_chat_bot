<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>Translator</title>

    <!-- Custom fonts for this template-->
    <link href="static/vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link
        href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
        rel="stylesheet">
    <link href="static/css/sb-admin-2.min.css" rel="stylesheet">
	<link href="static/css/style.css" rel="stylesheet">

</head>

<body id="page-top">

    <!-- Page Wrapper -->
    <div id="wrapper">

        <!-- Sidebar -->
        {% include 'sidebar.html' %}


        <!-- End of Sidebar -->

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column container-chat flag-texture">

            <!-- Main Content -->
            <div id="content">

              <!-- Topbar -->
                <nav class="navbar navbar-expand navbar-light topbar mb-4 static-top">
                    <!-- Sidebar Toggle (Topbar) -->
                    <button id="sidebarToggleTop" class="btn btn-link d-md-none rounded-circle mr-3">
                        <i class="fa fa-bars"></i>
                    </button>

                    <!-- Topbar Navbar -->
                    <div class="navbar-nav ml-auto">
						<div class="card shadow h-100 py-2 card-body">2025-03-06 14:59:45.946</div>
                   </div>

                </nav>
                <!-- End of Topbar -->

                <!-- Begin Page Content -->
					<div class="chat-section">



                        
                        <div style="height:600px; overflow-y:scroll; padding-right:100px; padding-left:100px; overflow-x:hidden;" class="chat-scroll">

                            <div class="row">
                                {% for entry in translation_history %}
                                <div class="col-md-12 text-right" style="margin-bottom:20px; ">
                                    <div class="message-text"><strong>You:</strong> {{ entry.original }}</div>
                                </div>
                                    <div class="col-md-12 text-left" style="margin-bottom:20px;">
                                        <div class="message-text"><strong>{{ entry.to_lang.upper() }}:</strong> {{ entry.translated }}</div>
                                    </div>
                                    <div class="col-md-12 text-left"><hr></div>
                                {% endfor %}
                            </div>
                            </div>





            <form action="/translator" method="post" class="miltry-form2">
              <div class="container">
                  <div class="row">


                      <!-- From Language Selection -->
                      <div class="col-4">
                          <div class="dropdown">
                              <button class="btn btn-secondary dropdown-toggle" type="button" id="fromLangButton"
                                  data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                  - Select Language -
                              </button>
                              <div class="dropdown-menu">
                                  <a class="dropdown-item" href="#" onclick="selectLang('fromLangButton', 'from_lang', 'en')">English</a>
                                  <a class="dropdown-item" href="#" onclick="selectLang('fromLangButton', 'from_lang', 'hi')">Hindi</a>
                                  <a class="dropdown-item" href="#" onclick="selectLang('fromLangButton', 'from_lang', 'zh')">Chinese</a>
                                  <a class="dropdown-item" href="#" onclick="selectLang('fromLangButton', 'from_lang', 'ur')">Urdu</a>
                                  <a class="dropdown-item" href="#" onclick="selectLang('fromLangButton', 'from_lang', 'bn')">Bangali</a>
                              </div>
                          </div>
                          <input type="hidden" name="from_lang" id="from_lang">
                      </div>
          
                      <div class="col-4 text-center">To</div>
          
                      <!-- To Language Selection -->
                      <div class="col-4">
                          <div class="dropdown">
                              <button class="btn btn-secondary dropdown-toggle" type="button" id="toLangButton"
                                  data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                  - Select Language -
                              </button>
                              <div class="dropdown-menu">
                                  <a class="dropdown-item" href="#" onclick="selectLang('toLangButton', 'to_lang', 'hi')">Hindi</a>
                                  <a class="dropdown-item" href="#" onclick="selectLang('toLangButton', 'to_lang', 'en')">English</a>
                                  <a class="dropdown-item" href="#" onclick="selectLang('toLangButton', 'to_lang', 'zh')">Chinese</a>
                                  <a class="dropdown-item" href="#" onclick="selectLang('toLangButton', 'to_lang', 'ur')">Urdu</a>
                                  <a class="dropdown-item" href="#" onclick="selectLang('toLangButton', 'to_lang', 'bn')">Bangali</a>
                              </div>
                          </div>
                          <input type="hidden" name="to_lang" id="to_lang">
                      </div>
                  </div>
          
                  <!-- Message Input -->
                  <div class="row my-4">
                      <div class="col-lg-12 miltry-form2">
                          <input type="text" name="message" class="form-control" placeholder="Type a Message..." required>
                          <button type="submit" class="send-icon"><img src="static/img/send-ico.png"></button>
                      </div>
                  </div>
          
                  <!-- Translated Text Display -->
        
              </div>
          </form>

          <form action="{{ url_for('translator_route.clear_chats') }}" method="POST">
            <button type="submit" class="btn btn-danger mt-3">Clear Chat</button>
        </form>
          
          <!-- JavaScript to Update Selected Language -->
          <script>
            function selectLang(buttonId, inputId, langCode) {
                let langMap = {
                    'en': 'English',
                    'hi': 'Hindi',
                    'zh': 'Chinese',
                    'ur': 'Urdu',
                    'bn': 'Bangali'
                };
        
                document.getElementById(inputId).value = langCode;
                document.getElementById(buttonId).innerText = langMap[langCode];
        
                // Save to localStorage
                if (inputId === 'from_lang') {
                    localStorage.setItem('selectedFromLang', langCode);
                } else if (inputId === 'to_lang') {
                    localStorage.setItem('selectedToLang', langCode);
                }
            }
        
            // On page load, apply saved languages
            document.addEventListener('DOMContentLoaded', function () {
                const langMap = {
                    'en': 'English',
                    'hi': 'Hindi',
                    'zh': 'Chinese',
                    'ur': 'Urdu',
                    'bn': 'Bangali'
                };
        
                let savedFromLang = localStorage.getItem('selectedFromLang');
                let savedToLang = localStorage.getItem('selectedToLang');
        
                if (savedFromLang) {
                    document.getElementById('from_lang').value = savedFromLang;
                    document.getElementById('fromLangButton').innerText = langMap[savedFromLang];
                }
        
                if (savedToLang) {
                    document.getElementById('to_lang').value = savedToLang;
                    document.getElementById('toLangButton').innerText = langMap[savedToLang];
                }
            });
        </script>
         
					</div>

 

        </div>

    </div>
    <!-- End of Page Wrapper -->

    <!-- Scroll to Top Button-->
    <a class="scroll-to-top rounded" href="#page-top">
        <i class="fas fa-angle-up"></i>
    </a>

    <!-- Bootstrap core JavaScript-->
    <script src="static/vendor/jquery/jquery.min.js"></script>
    <script src="static/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <!-- Core plugin JavaScript-->
    <script src="static/vendor/jquery-easing/jquery.easing.min.js"></script>
    <!-- Custom scripts for all pages-->
    <script src="static/js/sb-admin-2.min.js"></script>

</body>

</html>
