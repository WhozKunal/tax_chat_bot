<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>signup</title>

    <!-- Custom fonts for this template-->
    <link href="static/vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link
        href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
        rel="stylesheet">
    <link href="static/css/sb-admin-2.min.css" rel="stylesheet">
	<link href="static/css/style.css" rel="stylesheet">

</head>

<body id="page-top">

    <!-- Page Wrapper -->
    <div id="wrapper">


        {% include 'sidebar.html' %}

        <div
        id="content-wrapper"
        class="d-flex flex-column container-chat flag-texture"
      >
        <!-- Main Content -->
        <div id="content">
          <!-- Topbar -->
          <nav class="navbar navbar-expand navbar-light topbar mb-4 static-top">
            <!-- Sidebar Toggle (Topbar) -->
            <button
              id="sidebarToggleTop"
              class="btn btn-link d-md-none rounded-circle mr-3"
            >
              <i class="fa fa-bars"></i>
            </button>

            <!-- Topbar Navbar -->
            <div class="navbar-nav ml-auto">
              <div class="card shadow h-100 py-2 card-body">
                2025-03-06 14:59:45.946
              </div>
            </div>
          </nav>
     
                <!-- End of Topbar -->

                <!-- Begin Page Content -->
                <div class="container-fluid">
					<div class="signup-container">
						<div class="signup-section">
						<p class="text-center"><img style = "text-align: center; width :70px;margin-top:20px; margin-bottom:20px"  src="{{ url_for('static', filename='img/logo-circle.png') }}"></p>
						<h1 class="log-head text-center">User Registration</h1>






                        <!-- Add this inside the <div class="signup-section"> just before the form -->

                        {% if success %}
                        <div class="alert alert-success" role="alert">
                            {{ success }}
                        </div>
                    {% endif %}
                    {% if error %}
                        <div class="alert alert-danger" role="alert">
                            {{ error }}
                        </div>
                    {% endif %}
                    

<form method="POST" action="{{ url_for('signup') }}">

<input type="text" name="username" class="form-control my-3" placeholder="Username" required>
<input type="email" name="email" class="form-control my-3" placeholder="Email" required>
<input type="password" name="password" class="form-control" placeholder="Password" required>

<p class="app-typ text-center my-3">APPOINTMENT TYPE</p>
<p class="admin-txt text-center">
    <input type="radio" name="user_role" value="admin" required> Admin &nbsp;
    <input type="radio" name="user_role" value="user" required> User
</p>

<div class="text-center">
    <button type="submit" class="create-btn my-3">Create account</button>
</div>
</form>


                        
						</div>
					</div>

                </div>
               <!-- End of Main Content -->

 

        </div>
        <!-- End of Content Wrapper -->

    </div>
    <!-- End of Page Wrapper -->

    <!-- Scroll to Top Button-->
    <a class="scroll-to-top rounded" href="#page-top">
        <i class="fas fa-angle-up"></i>
    </a>

    <!-- Bootstrap core JavaScript-->
    <script src="static/vendor/jquery/jquery.min.js"></script>
    <script src="static/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <!-- Core plugin JavaScript-->
    <script src="static/vendor/jquery-easing/jquery.easing.min.js"></script>
    <!-- Custom scripts for all pages-->
    <script src="static/js/sb-admin-2.min.js"></script>

</body>

</html>
