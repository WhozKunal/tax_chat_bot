<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">
    <title>Summarizer</title>

    <!-- Custom fonts for this template-->
    <link href="static/vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
    <link href="static/css/sb-admin-2.min.css" rel="stylesheet">
    <link href="static/css/style.css" rel="stylesheet">
</head>

<body id="page-top">

    <!-- Page Wrapper -->
    <div id="wrapper">

        <!-- Sidebar -->
        {% include 'sidebar.html' %}
        <!-- Sidebar -->

        <!-- End of Sidebar -->

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column container-chat flag-texture">

            <!-- Main Content -->
            <div id="content">

                <!-- Topbar -->
                <nav class="navbar navbar-expand navbar-light topbar mb-4 static-top">
                    <!-- Sidebar Toggle (Topbar) -->
                    <button id="sidebarToggleTop" class="btn btn-link d-md-none rounded-circle mr-3">
                        <i class="fa fa-bars"></i>
                    </button>

                    <!-- Topbar Navbar -->
                    <div class="navbar-nav ml-auto">
                        <div class="card shadow h-100 py-2 card-body">2025-03-06 14:59:45.946</div>
                    </div>
                </nav>
                <!-- End of Topbar -->

                {% if response %}
                    <div id = "summaryResponse" style="height: 600px; overflow-y: scroll; overflow-x: hidden; padding: 40px 100px; margin-top: 30px; background-color: #f8f9fc18; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.05);">
                        <div style="font-family: 'Nunito', sans-serif; font-size: 15px; line-height: 1.5; color: #000;">
                            {{ response|safe }}
                        </div>
                    </div>
                {% endif %}

                <!-- Begin Page Content -->


                <!-- Loader -->
                <div id="loader" style="display: none; text-align: center; margin-top: 30px;">
               <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                <span class="sr-only">Loading...</span>
                </div>
                 <p style="margin-top: 10px;">Summarizing PDF... Please wait</p>
               </div>





                <div class="chat-section2" style="width: 100%;">
                    <form id= "summaryForm" action="/summarizer" method="post" enctype="multipart/form-data" style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; margin-top: 20px;">
                
                        <input type="file" name="pdf" accept=".pdf" required style="padding: 5px; border-radius: 5px; border: 1px solid #ccc; height: 42px;">
                
                        <input type="text" name="word" placeholder="Word" style="min-width: 120px; padding: 5px 10px; border-radius: 5px; border: 1px solid #ccc; height: 42px;">
                
                        <input type="text" name="paragraph" placeholder="Paragraph" style="min-width: 120px; padding: 5px 10px; border-radius: 5px; border: 1px solid #ccc; height: 42px;">
                
                        <button type="submit" style="background-color: #4e73df; color: white; border: none; border-radius: 5px; padding: 0 20px; height: 42px; cursor: pointer;">
                            Upload PDF
                        </button>
                
                    </form>
                </div>
                
                <!-- End of Main Content -->

            </div>
            <!-- End of Content Wrapper -->

        </div>
        <!-- End of Page Wrapper -->

        <!-- Scroll to Top Button-->
        <a class="scroll-to-top rounded" href="#page-top">
            <i class="fas fa-angle-up"></i>
        </a>

        <!-- Bootstrap core JavaScript-->
        <script src="static/vendor/jquery/jquery.min.js"></script>
        <script src="static/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
        <!-- Core plugin JavaScript-->
        <script src="static/vendor/jquery-easing/jquery.easing.min.js"></script>
        <!-- Custom scripts for all pages-->
        <script src="static/js/sb-admin-2.min.js"></script>



        <script>
            document.getElementById('summaryForm').addEventListener('submit', function (e) {

               
            document.getElementById('loader').style.display = 'block';



                const summaryDiv = document.getElementById('summaryResponse');
                if (summaryDiv) {
                    summaryDiv.style.display = 'none';
                }
                // Hide the summary response div
            });
        </script>
        

</body>

</html>
